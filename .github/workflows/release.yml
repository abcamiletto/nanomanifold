name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The tag is created last, together with the GitHub release, so it only exists once
# PyPI has the files. A failed run leaves no tag and re-running retries every step;
# publishing skips files already on PyPI.
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - name: Detect unreleased version
        id: version
        run: |
          version=$(uv version --short)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: uv build
      - name: Publish to PyPI
        if: steps.version.outputs.changed == 'true'
        run: uv publish --check-url https://pypi.org/simple
      - name: Tag and create GitHub release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          # uv build also writes dist/.gitignore, so name the artifacts explicitly.
          files: |
            dist/*.whl
            dist/*.tar.gz
